[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "seekrelay"
version = "0.1.0"
description = "One async interface for AI-agent web search: Tavily, Brave Search and self-hosted SearXNG with fallback, retries, caching and a PII guard."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maksym" }]
keywords = ["search", "web-search", "llm", "rag", "ai-agents", "tavily", "brave-search", "searxng"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Pinned: formatter output (incl. Markdown code blocks) changes between minors.
    "ruff>=0.16,<0.17",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/MaksicosUA/SeekRelay"
Issues = "https://github.com/MaksicosUA/SeekRelay/issues"
Changelog = "https://github.com/MaksicosUA/SeekRelay/blob/main/CHANGELOG.md"

[project.scripts]
seekrelay = "seekrelay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/seekrelay"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "deploy", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
