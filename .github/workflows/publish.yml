# Publishes to PyPI when a version tag is pushed. Trusted Publishing supplies the credentials,
# so no token is stored. PyPI never lets a version be replaced, so nothing is uploaded unless the
# tag, pyproject.toml and _version.py agree and the built wheel passes the tests.
name: Publish

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Test the wheel as a user installs it
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl pytest pytest-asyncio
          "$RUNNER_TEMP/wheel/bin/pytest"
      - name: Check the tag against the package version
        run: |
          version=$("$RUNNER_TEMP/wheel/bin/seekrelay" --version | cut -d' ' -f2)
          test "v$version" = "$GITHUB_REF_NAME"
          test -f "dist/seekrelay-$version-py3-none-any.whl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/seekrelay/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
